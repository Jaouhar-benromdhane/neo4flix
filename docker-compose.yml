version: '3.8'

services:

  # ─────────────────────────────────────────────
  # NEO4J DATABASE
  # ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4flix-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/neo4flix123
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
    networks:
      - neo4flix-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4flix123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: neo4flix-gateway
    ports:
      - "8080:8080"
    environment:
      MOVIE_SERVICE_URL: http://movie-service:8081
      USER_SERVICE_URL: http://user-service:8082
      RATING_SERVICE_URL: http://rating-service:8083
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8084
      JWT_SECRET: ${JWT_SECRET:-neo4flix_secret_key_change_in_prod}
    depends_on:
      - movie-service
      - user-service
      - rating-service
      - recommendation-service
    networks:
      - neo4flix-network

  # ─────────────────────────────────────────────
  # MOVIE SERVICE
  # ─────────────────────────────────────────────
  movie-service:
    build: ./movie-service
    container_name: neo4flix-movie
    ports:
      - "8081:8081"
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4flix123
      JWT_SECRET: ${JWT_SECRET:-neo4flix_secret_key_change_in_prod}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4flix-network

  # ─────────────────────────────────────────────
  # USER SERVICE
  # ─────────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: neo4flix-user
    ports:
      - "8082:8082"
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4flix123
      JWT_SECRET: ${JWT_SECRET:-neo4flix_secret_key_change_in_prod}
      JWT_EXPIRATION_MS: 86400000
      TWO_FACTOR_ENABLED: "true"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4flix-network

  # ─────────────────────────────────────────────
  # RATING SERVICE
  # ─────────────────────────────────────────────
  rating-service:
    build: ./rating-service
    container_name: neo4flix-rating
    ports:
      - "8083:8083"
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4flix123
      JWT_SECRET: ${JWT_SECRET:-neo4flix_secret_key_change_in_prod}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4flix-network

  # ─────────────────────────────────────────────
  # RECOMMENDATION SERVICE
  # ─────────────────────────────────────────────
  recommendation-service:
    build: ./recommendation-service
    container_name: neo4flix-recommendation
    ports:
      - "8084:8084"
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4flix123
      JWT_SECRET: ${JWT_SECRET:-neo4flix_secret_key_change_in_prod}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4flix-network

  # ─────────────────────────────────────────────
  # ANGULAR FRONTEND
  # ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: neo4flix-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - neo4flix-network

# ─────────────────────────────────────────────
# NETWORKS & VOLUMES
# ─────────────────────────────────────────────
networks:
  neo4flix-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
