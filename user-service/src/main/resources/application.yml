server:
  port: 8082

spring:
  application:
    name: user-service

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_USERNAME:neo4j}
      password: ${SPRING_NEO4J_PASSWORD:neo4flix123}

  data:
    neo4j:
      database: neo4j

  # ── OAuth2 Google ──────────────────────────────────────────────
  # Pour activer Google Login :
  #   1. Créer un projet sur https://console.cloud.google.com/
  #   2. Activer l'API Google+ / OAuth2
  #   3. Créer des credentials (OAuth 2.0 Client ID)
  #   4. Ajouter redirect URI : http://localhost:8082/login/oauth2/code/google
  #   5. Renseigner les variables d'environnement GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:neo4flix_super_secret_key_change_this_in_production_min_32_characters}
  expiration: ${JWT_EXPIRATION:86400000} # 24h en millisecondes

# Logging
logging:
  level:
    com.neo4flix: DEBUG
    org.springframework.security: INFO
    org.springframework.data.neo4j: INFO

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
