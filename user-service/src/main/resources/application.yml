server:
  port: 8082

spring:
  application:
    name: user-service

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_USERNAME:neo4j}
      password: ${SPRING_NEO4J_PASSWORD:neo4flix123}

  data:
    neo4j:
      database: neo4j

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:neo4flix_super_secret_key_change_this_in_production_min_32_characters}
  expiration: ${JWT_EXPIRATION:86400000} # 24h en millisecondes

# Logging
logging:
  level:
    com.neo4flix: DEBUG
    org.springframework.security: INFO
    org.springframework.data.neo4j: INFO

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
