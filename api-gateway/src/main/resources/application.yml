server:
  port: 8080
  # ── HTTPS / SSL ────────────────────────────────────────────────
  # Port 8443 pour HTTPS (certificat auto-signé en dev)
  # En production : remplacer par un vrai certificat Let's Encrypt
  ssl:
    enabled: true
    key-store: classpath:ssl/neo4flix-keystore.p12
    key-store-password: neo4flix123
    key-store-type: PKCS12
    key-alias: neo4flix
  http2:
    enabled: true

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ─────────────────────────────────────────────────────────────
      # GLOBALCORS : autorise le frontend Angular (port 4200)
      # à appeler l'API sans être bloqué par le navigateur.
      # ─────────────────────────────────────────────────────────────
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"    # Angular dev (HTTP)
              - "https://localhost:4200"   # Angular dev (HTTPS)
              - "http://localhost:80"      # Angular production Docker
              - "https://localhost:443"    # Angular production HTTPS
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Supprime les headers CORS en double (gateway + microservice)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # ─────────────────────────────────────────────────────────────
      # ROUTES : règles de routage
      #
      # Chaque route définit :
      #   id      : nom unique de la route
      #   uri     : où envoyer la requête (microservice cible)
      #   predicates : conditions pour matcher la requête
      #   filters : transformations à appliquer
      #
      # StripPrefix=1 : enlève le premier segment du chemin
      #   /api/movies/...  →  /movies/...  (enlève /api)
      # ─────────────────────────────────────────────────────────────
      routes:

        # ── movie-service ──────────────────────────────────────────
        - id: movie-service
          uri: ${MOVIE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/movies/**
          filters:
            - StripPrefix=1
            # Ajoute un header pour identifier que la requête vient du gateway
            - AddRequestHeader=X-Gateway-Source, neo4flix-gateway

        # ── user-service (auth) ────────────────────────────────────
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # ── user-service (users) ───────────────────────────────────
        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        # ── rating-service ─────────────────────────────────────────
        - id: rating-service
          uri: ${RATING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/ratings/**
          filters:
            - StripPrefix=1

        # ── recommendation-service ─────────────────────────────────
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/recommendations/**
          filters:
            - StripPrefix=1

# ─────────────────────────────────────────────────────────────────
# ACTUATOR : endpoints de monitoring
# http://localhost:8080/actuator/health      → état du gateway
# http://localhost:8080/actuator/gateway/routes → toutes les routes
# ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.neo4flix: DEBUG
